<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>內容管理｜更好拾光</title><link rel="stylesheet" href="styles.css"></head><body><div class="site-shell inner-shell"><header class="inner-header"><a class="wordmark" href="index.html">更好拾光</a><a href="index.html">查看網站 ↗</a></header><main class="inner-main admin-main"><span class="section-index">EDITORIAL DESK</span><h1>內容管理</h1><p id="admin-message" role="status">請登入管理員帳號</p><section id="login-panel" class="admin-panel"><h2>登入</h2><form id="login-form"><label>電子郵件<input name="email" type="email" autocomplete="username" required></label><label>密碼<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">登入後台</button></form></section><section id="dashboard" hidden><div class="admin-actions"><strong id="draft-count">待審清單</strong><div><a href="quiz-admin.html">管理屋主測驗題庫 ↗</a> <button type="button" id="logout">登出</button></div></div><details class="admin-panel password-panel"><summary>設定／變更登入密碼</summary><form id="password-form"><label>新密碼<input name="password" type="password" autocomplete="new-password" minlength="8" required></label><label>再次輸入新密碼<input name="confirm" type="password" autocomplete="new-password" minlength="8" required></label><button type="submit">儲存密碼</button><p id="password-message" role="status">設定後可使用電子郵件與密碼登入。請勿與其他網站共用密碼。</p></form></details><div class="admin-layout"><aside id="draft-list" class="draft-list" aria-label="待審與草稿文章"></aside><form id="editor-form" class="admin-panel" hidden><input type="hidden" name="post_id"><h2>編輯官網文章</h2><p id="source-date"></p><label>官網標題<input name="title" required maxlength="120"></label><div class="block-editor"><div class="block-editor-head"><strong>官網內文</strong><span>逐段安排故事，使用箭頭調整順序</span></div><div id="story-block-list" class="story-block-list"></div><div class="block-add" aria-label="新增文章區塊"><button type="button" data-add-block="paragraph">＋ 段落</button><button type="button" data-add-block="heading">小標題</button><button type="button" data-add-block="quote">引言</button><button type="button" data-add-block="image">圖片</button><button type="button" data-add-block="divider">分隔線</button></div><details class="story-preview"><summary>預覽讀者看到的文章</summary><div id="story-preview-body" class="article-body article-prose"></div></details><textarea name="body" hidden></textarea></div><label>封面圖片網址<input name="image_url" type="url" placeholder="https://"></label><label>主要分類<select name="category" required><option value="">選擇分類</option><option>房子與人</option><option>都更現場</option><option>都更白話說</option><option>產業觀察</option></select></label><label>標籤，以逗號分隔<input name="tags" placeholder="老屋, 鄰居"></label><label class="check-label"><input name="featured" type="checkbox">放在首頁精選故事</label><div class="editor-buttons"><button type="button" id="save-draft">儲存草稿</button><button type="button" id="publish-article">發布到官網</button><button type="button" id="unpublish-article" hidden>從官網下架</button></div><p>Threads 原文會獨立保留，修改官網草稿不會直接更改已發布版本</p><details><summary>查看 Threads 原文</summary><pre id="original-text"></pre><a id="original-link" target="_blank" rel="noopener noreferrer">原貼文 ↗</a></details></form></div></section></main></div><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script><script src="story-blocks.js" defer></script><script src="admin.js" defer></script></body></html>
